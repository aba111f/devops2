apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-chart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/aba111f1/devops2/lab9
    targetRevision: HEAD
    path: my-chart
    helm:
      valuesFiles:
        - values.yaml
  destiantion:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}